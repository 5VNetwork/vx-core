version: v2

managed:
  enabled: true

plugins:
  - remote: buf.build/protocolbuffers/go
    out: .
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - remote: buf.build/protocolbuffers/dart
    out: ../../../VX/lib/data/remotedb
    opt:
      - grpc
