syntax = "proto3";

package x.proxy;
option go_package = "github.com/5vnetwork/vx-core/app/configs/proxy";

import "protos/user.proto";
import "common/net/net.proto";

message Shadowsocks2022ServerConfig {
  string method = 1;
  x.UserConfig user = 2;
  repeated x.common.net.Network networks = 5;
}

message Shadowsocks2022ClientConfig {
  string method = 3;
  string key = 4;
}
