syntax = "proto3";

package x;
option go_package = "github.com/5vnetwork/vx-core/app/configs";

message DispatcherConfig { 
  // SniffingConfig sniff = 1; 
  bool fallback_to_proxy = 2;
  bool fallback_to_domain = 3;
  repeated string destination_override = 4;
  bool sniff = 5;
  reserved 6;
  bool ipv6_use_domain = 7;
}
