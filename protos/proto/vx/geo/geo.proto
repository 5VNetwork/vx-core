syntax = "proto3";
package vx.geo;

import "vx/common/geo/geo.proto";
import "vx/router/router.proto";

option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx";

message GreatDomainSetConfig {
  string name = 3;
  string opposite_name = 4;
  repeated string ex_names = 5;
  repeated string in_names = 6;
}

// Remote geo data file: HTTPS download into filepath on a cron schedule.
message GeoRemoteFile {
  string filepath = 1;
  string source_url = 2;
  // Standard 5-field cron (minute hour day month weekday). Empty = prefetch only at startup / reconfigure.
  string refresh_cron = 3;
}

message AtomicDomainSetConfig {
  string name = 1;
  // either one of the following two fields should be set
  repeated vx.common.geo.Domain domains = 2;
  GeositeConfig geosite = 3;
  repeated GeositeConfig geosites = 8;
  bool use_bloom_filter = 4;
  repeated string clash_files = 5;
  bool inverse = 6;
  repeated GeoRemoteFile remote_geo_files = 7;
}

message DomainSetConfig {
  string name = 1;
  repeated string tags = 2;
}

message GreatIPSetConfig {
  string name = 3;
  string opposite_name = 4;
  repeated string ex_names = 5;
  repeated string in_names = 6;
}

message AtomicIPSetConfig {
  string name = 3;
  repeated vx.common.geo.CIDR cidrs = 2;
  GeoIPConfig geoip = 1;
  bool inverse = 4;
  repeated string clash_files = 5;
  repeated GeoRemoteFile remote_geo_files = 6;
}

message GeoConfig {
  reserved 1;
  // There should be no same name in great_domain_sets and atomic_domain_sets.
  // Same for great_ip_sets and atomic_ip_sets.
  repeated GreatDomainSetConfig great_domain_sets = 3;
  repeated GreatIPSetConfig great_ip_sets = 4;
  repeated AtomicDomainSetConfig atomic_domain_sets = 5;
  repeated AtomicIPSetConfig atomic_ip_sets = 6;
  repeated AppSetConfig app_sets = 7;
}

message GeositeConfig {
  repeated string codes = 1;
  repeated string attributes = 2;
  string filepath = 3;
  string remote_url = 4;
  string refresh_cron = 5;
}

message GeoIPConfig {
  string filepath = 1;
  repeated string codes = 2;
  string remote_url = 3;
  string refresh_cron = 4;
}

message AppSetConfig {
  string name = 1;
  repeated vx.router.AppId app_ids = 2;
  repeated string clash_files = 3;
}
