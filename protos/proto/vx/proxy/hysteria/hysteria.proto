syntax = "proto3";
package vx.proxy.hysteria;

import "vx/transport/security/tls/tls.proto";
import "vx/user/user.proto";

option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx/proxy";
enum Obfs {
  Salamander = 0;
}

message QuicConfig {
  // MB
  uint32 initial_stream_receive_window = 5;
  uint32 max_stream_receive_window = 6;
  uint32 initial_connection_receive_window = 7;
  uint32 max_connection_receive_window = 8;
  // bytes
  uint64 initial_stream_receive_window_bytes = 13;
  uint64 max_stream_receive_window_bytes = 14;
  uint64 initial_connection_receive_window_bytes = 15;
  uint64 max_connection_receive_window_bytes = 16;

  uint32 max_idle_timeout = 9;
  uint32 keep_alive_period = 10;
  bool disable_path_mtu_discovery = 11;
  // server only
  uint32 max_incoming_streams = 12;
}

message BandwidthConfig {
  // for client, this is upload
  uint32 max_tx = 1;
  // for client, this is download
  uint32 max_rx = 2;
}

message Hysteria2ClientConfig {
  string auth = 3;
  vx.transport.security.tls.TlsConfig tls_config = 4;
  QuicConfig quic = 12;
  bool fast_open = 13;
  BandwidthConfig bandwidth = 14;
  ObfsConfig obfs = 15;
  RealmConfig realm = 16;
}

message Hysteria2ServerConfig {
  repeated vx.user.UserConfig users = 1;
  ObfsConfig obfs = 2;
  BandwidthConfig bandwidth = 3;
  QuicConfig quic = 4;
  bool ignore_client_bandwidth = 7;
  vx.transport.security.tls.TlsConfig tls_config = 8;
  repeated string addresses = 9;
  RealmConfig realm = 11;
}

message RealmPortMappingConfig {
  bool enabled = 1;
  // seconds; 0 uses default
  uint32 timeout = 2;
  // seconds; 0 uses default
  uint32 lifetime = 3;
}

message RealmConfig {
  string realm_addr = 10;
  uint32 local_port = 11;
  // fallback STUN servers when not specified in the realm URL query
  repeated string stun_servers = 1;
  // seconds; 0 uses default (4s)
  uint32 stun_timeout = 2;
  // seconds; 0 uses default (10s)
  uint32 punch_timeout = 3;
  // seconds; 0 uses half of rendezvous session TTL
  uint32 heartbeat_interval = 4;
  // allow realm+http:// and skip TLS verification for rendezvous
  bool insecure = 5;
  // v4, v6, or dual (empty = dual)
  string ip_mode = 6;
  RealmPortMappingConfig port_mapping = 7;
}

message ObfsConfig {
  oneof obfs {
    SalamanderConfig salamander = 1;
  }
}

message SalamanderConfig {
  string password = 1;
}
