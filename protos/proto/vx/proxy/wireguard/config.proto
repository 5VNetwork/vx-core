syntax = "proto3";

package vx.proxy.wireguard;

option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx/proxy";

message PeerConfig {
  string public_key = 1;
  string pre_shared_key = 2;
  string endpoint = 3;
  uint32 keep_alive = 4;
  repeated string allowed_ips = 5;
}

message DeviceConfig {
  string secret_key = 1;
  repeated string endpoint = 2;
  repeated PeerConfig peers = 3;
  int32 mtu = 4;
  int32 num_workers = 5;
  bytes reserved = 6;
  bool is_client = 8;
  bool no_kernel_tun = 9;
}
