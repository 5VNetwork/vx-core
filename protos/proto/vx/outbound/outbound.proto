syntax = "proto3";
package vx.outbound;

import "google/protobuf/any.proto";
import "vx/common/net/net.proto";
import "vx/transport/transport.proto";

option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx";

message OutboundHandlerConfig {
  string tag = 1;
  vx.transport.TransportConfig transport = 3;
  // Whether to enable mux
  bool enable_mux = 4;
  // Mux config
  MuxConfig mux_config = 12;
  // Address of the outbound handler
  string address = 5;
  uint32 port = 6;
  repeated vx.common.net.PortRange ports = 7;
  google.protobuf.Any protocol = 8;
  // Whether to use Udp over Tcp
  bool uot = 9;
  // How to resolve domain if address is domain
  DomainStrategy domain_strategy = 10;
  oneof port_select_strategy {
    RandomPortSelectStrategy random = 30;
    OnePortSelectStrategy one = 31;
  }
}

// all ports are used at the same time
message RandomPortSelectStrategy {}

// one port is used at a time
message OnePortSelectStrategy {
  // how long to switch port
  uint32 interval = 1;
  // only being considered when interval is not set
  // min interval to switch port
  uint32 min_interval = 2;
  // max interval to switch port
  uint32 max_interval = 3;
}

message MuxConfig {
  uint32 max_connection = 1;
  uint32 max_concurrency = 2;
}

enum DomainStrategy {
  PreferIPv4 = 0;
  PreferIPv6 = 1;
  IPv4Only = 2;
  IPv6Only = 3;
  Speed = 4;
}

message ChainHandlerConfig {
  repeated OutboundHandlerConfig handlers = 1;
  string tag = 2;
}

message OutboundConfig {
  // @deprecated
  repeated OutboundHandlerConfig outbound_handlers = 1;
  // @deprecated
  repeated ChainHandlerConfig chain_handlers = 2;
  repeated HandlerConfig handlers = 3;
  bool hysteria_reject_quic = 4;
  bool handler_link_stats = 5;
  bool handler_meter = 6;
  bool total_counter = 7;
}

message HandlerConfig {
  oneof type {
    OutboundHandlerConfig outbound = 1;
    ChainHandlerConfig chain = 2;
  }
  optional bool support_ipv6 = 3;
}

// Mirrors xsqlite.OutboundHandler. Used in TmConfig when the remote DB
// is unavailable so selectors can still match and build chains.
message OutboundHandler {
  int64 id = 1;
  bool selected = 2;
  string country_code = 3;
  int32 ok = 4;
  double speed = 5;
  int32 speed_test_time = 6;
  int32 ping = 7;
  int32 ping_test_time = 8;
  optional int64 sub_id = 9;
  bytes config = 10;
  string sni = 11;
  string server_ip = 12;
  int32 support6 = 13;
  int32 support6_test_time = 14;
  // Not on the sqlite row; stored for group filter matching.
  repeated string group_tags = 15;
  // Original node name (outbound tag is the numeric id).
  string name = 16;
}

message HandlerConfigs {
  repeated HandlerConfig configs = 1;
}
