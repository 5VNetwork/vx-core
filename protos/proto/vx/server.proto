syntax = "proto3";
package vx;

import "vx/dialerfactory/dialerfactory.proto";
import "vx/dispatcher/dispatcher.proto";
import "vx/dns/dns.proto";
import "vx/geo/geo.proto";
import "vx/inbound/inbound.proto";
import "vx/log/logger.proto";
import "vx/outbound/outbound.proto";
import "vx/policy.proto";
import "vx/router/router.proto";
import "vx/user/user.proto";

option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx/server";

message ServerConfig {
  repeated vx.inbound.ProxyInboundConfig inbounds = 3;
  repeated vx.inbound.MultiProxyInboundConfig multi_inbounds = 11;
  vx.PolicyConfig policy = 4;
  vx.router.RouterConfig router = 5;
  vx.log.LoggerConfig log = 6;
  repeated vx.user.UserConfig users = 7;
  repeated vx.outbound.OutboundHandlerConfig outbounds = 9;
  vx.geo.GeoConfig geo = 10;
  vx.dns.DnsConfig dns = 12;
  vx.dispatcher.DispatcherConfig dispatcher = 14;
  vx.dialerfactory.DialerFactoryConfig dialer_factory = 15;
}
