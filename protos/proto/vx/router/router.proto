syntax = "proto3";
package vx.router;

import "google/protobuf/any.proto";
import "vx/common/geo/geo.proto";
import "vx/common/net/net.proto";

option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx";

message RouterConfig {
  repeated RuleConfig rules = 1;
}

message SelectorsConfig {
  repeated SelectorConfig selectors = 1;
}

message RuleConfig {
  // either outbound_tag or selector_tag should be specified but not both
  // when both are empty, it means blocks
  string outbound_tag = 1;
  string selector_tag = 2;

  // used to match source ip
  repeated string src_cidrs = 5;
  // used to match source ip
  repeated string src_ip_tags = 6;
  // used to match dst ip
  repeated string dst_cidrs = 8;
  // used to match dst ip
  repeated string dst_ip_tags = 9;
  // resolve domain to ip when ip is not available
  // All ips must be in the dst ip set.
  bool resolve_domain = 26;
  // resolve domain target to ip, and change the target to an ip address that is
  // in the dst ip set .
  // Any ip in the dst ip set is okay.
  bool resolve_soft_rewrite = 30;
  // resolve domain target to ip, but do not change the target to ip.
  // Any ip in the dst ip set is okay.
  bool resolve_soft_no_rewrite = 31;
  // used to match target domain
  repeated vx.common.geo.Domain geo_domains = 11;
  repeated string domain_tags = 13;
  // skip sniff for connectiosn use ip targets.
  // By default, sniffing is enabled for connections with ip targets.
  bool skip_sniff = 27;
  // used to match user id
  repeated string usernames = 14;
  repeated string inbound_tags = 15;
  repeated vx.common.net.Network networks = 16;
  repeated vx.common.net.PortRange src_port_ranges = 17;
  repeated vx.common.net.PortRange dst_port_ranges = 18;
  repeated AppId app_ids = 19;
  bool ipv6 = 20;
  // for debugging
  string rule_name = 21;
  bool fake_ip = 22;
  bool match_all = 23;
  repeated string app_tags = 24;
  repeated string all_tags = 25;
  repeated string protocols = 28;

  Condition condition = 32;
  // all conditions must match for the rule to apply
  repeated Condition conditions = 33;

  message Fallback {
    string selector_tag = 1;
    string outbound_tag = 2;

    message Action {
      bool ip_to_domain = 1;
    }
    Action action = 3;

    repeated string dst_ip_tags = 10;
    repeated string domain_tags = 11;
    bool match_all = 12;
    Condition condition = 13;
    // if condition matched, this fallback will be the last one
    bool last = 14;
    repeated Condition conditions = 15;
  }
  repeated Fallback fallbacks = 29;
}

message Condition {
  // used to match source ip
  repeated string src_cidrs = 5;
  // used to match source ip
  repeated string src_ip_tags = 6;
  // used to match dst ip
  repeated string dst_cidrs = 8;
  // used to match dst ip
  repeated string dst_ip_tags = 9;
  // resolve domain to ip when ip is not available
  // All ips must be in the dst ip set.
  bool resolve_domain = 26;
  // resolve domain target to ip, and change the target to an ip address that is
  // in the dst ip set .
  // Any ip in the dst ip set is okay.
  bool resolve_soft_rewrite = 30;
  // resolve domain target to ip, but do not change the target to ip.
  // Any ip in the dst ip set is okay.
  bool resolve_soft_no_rewrite = 31;
  // used to match target domain
  repeated vx.common.geo.Domain geo_domains = 11;
  repeated string domain_tags = 13;
  // skip sniff for connectiosn use ip targets.
  // By default, sniffing is enabled for connections with ip targets.
  bool skip_sniff = 27;
  // used to match user id
  repeated string usernames = 14;
  repeated string inbound_tags = 15;
  repeated vx.common.net.Network networks = 16;
  repeated vx.common.net.PortRange src_port_ranges = 17;
  repeated vx.common.net.PortRange dst_port_ranges = 18;
  repeated AppId app_ids = 19;
  bool ipv6 = 20;
  bool fake_ip = 22;
  repeated string app_tags = 24;
  repeated string all_tags = 25;
  repeated string protocols = 28;
  // connection uses ip targets and has no sniffed domain
  bool has_no_domain = 29;
}

message SelectorConfig {
  string tag = 1;
  message Filter {
    // If an outbound's tag has prefix of any of the prefixes, match!
    repeated string prefixes = 1;
    // A outbound handler will match if its tag is one of the tags
    repeated string tags = 2;
    // If true, a handler will be selected if it does not match all conditions
    repeated string sub_strings = 9;
    bool inverse = 4;

    // These are client only. Since server does not use database
    repeated int64 sub_ids = 5;
    repeated int64 handler_ids = 6;
    bool selected = 7;
    bool all = 8;
    repeated string group_tags = 3;
    repeated string country_codes = 10;
  }
  // how to select handlers to be used
  enum SelectingStrategy {
    ALL = 0;
    ALL_OK = 1;
    LEAST_PING = 2;
    MOST_THROUGHPUT = 3;
    // select good ones
    TOP_PING = 4;
    TOP_THROUGHPUT = 5;
  }
  // if there are many handlers, how to balance them
  enum BalanceStrategy {
    RANDOM = 0;
    // balance based on app first, if no app, based on root domain
    MEMORY = 1;
  }
  Filter filter = 2;
  SelectingStrategy strategy = 3;
  BalanceStrategy balance_strategy = 4;
  // if not empty, these handlers will be used as land handlers
  // ids of the outbound handler
  repeated int64 land_handlers = 6;
  // This should be true when not using database
  bool select_from_om = 7;
  // Download size in bytes for periodic speed tests when speed_test_size_range is unset.
  uint32 speed_test_size = 8;
  uint32 speed_test_interval = 9;
  uint32 ping_test_interval = 10;
  uint32 unusable_test_interval = 11;
  // If set with 0 < min <= max, each speed test picks a random download size in [min, max] bytes (inclusive).
  // When unset or invalid, speed_test_size applies (default 1 MiB in core when zero).
  message SpeedTestSizeRange {
    uint32 min = 1;
    uint32 max = 2;
  }
  SpeedTestSizeRange speed_test_size_range = 12;
}

message AppId {
  enum Type {
    // The value is used as is. "keyword"
    Keyword = 0;
    Prefix = 1;
    Exact = 2;
  }
  Type type = 1;
  string value = 2;
}
