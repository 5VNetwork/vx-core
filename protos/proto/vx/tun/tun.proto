syntax = "proto3";
package vx.tun;
option go_package = "buf.build/gen/go/vvvvv/vx/protocolbuffers/go/vx";

message TunConfig {
  string tag = 2;
  Mode mode = 3;
  // whether to bind outbound traffic to the primary physical interface.
  // This should be true if default route is to tun.
  bool should_bind_device = 4;
  TunDeviceConfig device = 5;
  enum TUN46Setting {
    // Apply only ipv4 settings of [device] to the tun.
    FOUR_ONLY = 0;
    // Apply both ipv4 and ipv6 settings of [device] to the tun.
    BOTH = 1;
    // Apply ipv4 and ipv6 settings of [device] to the tun based on default nic.
    // When default nic has no global ipv6 address, apply only ipv4 settings of [device] to the tun.
    DYNAMIC = 2;
  }
  // Controls whether to apply ipv4 and ipv6 settings of [device] to the tun.
  TUN46Setting tun46_setting = 8;
  // based on dst, src, network to match a handler, 
  // if the handler does not support ipv6, reject the request
  bool reject_ipv6 = 9;
}


enum Mode {
  MODE_SYSTEM = 0;
  MODE_GVISOR = 1;
}

message TunDeviceConfig {
  string cidr4 = 1;
  string cidr6 = 2;
  string name = 3;
  uint32 mtu = 4;
  // path to a dir containing four folders: amd64, x86, arm, arm64.
  // Each folder contains the wintun.dll for the corresponding platform.
  // Absolute or relative to cwd
  // Windows only
  string path = 5;
  repeated string dns4 = 6;
  repeated string dns6 = 7;
  repeated string routes4 = 9;
  repeated string routes6 = 10;
  // !Windows
  uint32 fd = 11;
  // apps that does not use tun. Android only
  repeated string black_list_apps = 12;
  // apps that use tun. Android only
  repeated string white_list_apps = 13;
}
